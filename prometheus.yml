global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'moveinmate-backend'
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['backend:8000']
    scrape_interval: 15s
